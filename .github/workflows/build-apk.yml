name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The phone APK only. The TV module builds this app's whole source tree a
    # second time (see tv/build.gradle.kts) and every phone build bundles the
    # watch app, so neither belongs in a quick check of the phone app;
    # -Pbitchord.bundleWear=false is the project's own switch for the latter.
    - name: Build Debug APK
      id: build
      continue-on-error: true
      run: |
        set -o pipefail
        ./gradlew :app:assembleDebug -Pbitchord.bundleWear=false 2>&1 | tee build.log

    # Kotlin's errors exist only in the log, which is hard to read on a phone.
    # Surface them as annotations so they show on the run's own page — errors
    # first, and the failing task if the compile itself said nothing, since
    # GitHub shows ten of them and the warnings would otherwise fill the list.
    - name: Report build errors
      if: steps.build.outcome == 'failure'
      run: |
        errors=$(grep -E "^e: " build.log | head -10)
        if [ -z "$errors" ]; then
          errors=$(grep -E "^(FAILURE|\* What went wrong|Execution failed|> )" build.log | head -10)
        fi
        printf '%s\n' "$errors" | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
          echo "::error title=Build::$line"
        done
        exit 1

    - name: Upload Debug APK
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-local-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
